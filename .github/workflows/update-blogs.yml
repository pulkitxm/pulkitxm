name: Update Latest Blogs

on:
  schedule:
    - cron: '0 0 * * *'  # Runs every day at midnight UTC
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: read

jobs:
  update-blogs:
    runs-on: ubuntu-latest
    environment: pukbot-production

    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.PUKBOT_CLIENT_ID }}
          private-key: ${{ secrets.PUKBOT_PRIVATE_KEY }}
          owner: pulkitxm
          repositories: pulkitxm
          permission-contents: write
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git
        run: |
          git config user.name "pukbot[bot]"
          git config user.email "320458784+pukbot[bot]@users.noreply.github.com"

      - name: Update blogs
        run: ./scripts/update-blogs.sh
